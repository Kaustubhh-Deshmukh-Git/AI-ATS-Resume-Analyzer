# Render Blueprint specification for ResumeIQ Express API
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: resumeiq-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: CLIENT_ORIGIN
        sync: false

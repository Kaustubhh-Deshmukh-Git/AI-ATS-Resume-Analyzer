services:
  # Express Backend API Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: resumeiq-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/resumeiq}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - JWT_EXPIRES_IN=1h
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost:5173}
    depends_on:
      mongo:
        condition: service_healthy
        required: false

  # React Vite Frontend SPA
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000/api/v1}
    container_name: resumeiq-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

  # Local MongoDB Service (fallback if Atlas is not configured)
  mongo:
    image: mongo:7.0
    container_name: resumeiq-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongo_data:
